        // --- Lucide Icon 轉接層 (修正版) ---
        // 修正說明：Lucide 新版移除了 icon 物件上的 .toSvg() 方法
        // 改用 lucide.createElement() 來生成 DOM，再轉為字串
        const IconWrapper = ({ name, color, size, className, strokeWidth, ...props }) => {
            // Lucide CDN 暴露的是 `lucide.icons` 物件
            const iconDef = lucide.icons[name];
            
            if (!iconDef) {
                console.warn(`Icon ${name} not found`);
                return null;
            }

            try {
                // 使用 Lucide 的 helper 建立 SVG DOM 元素
                const svgElement = lucide.createElement(iconDef);

                // 設定我們需要的屬性 (會覆蓋預設值)
                svgElement.setAttribute('width', size || 24);
                svgElement.setAttribute('height', size || 24);
                svgElement.setAttribute('stroke', color || "currentColor");
                svgElement.setAttribute('stroke-width', strokeWidth || 2);
                
                if (className) {
                    // 處理既有的 class 與傳入的 className
                    const existingClass = svgElement.getAttribute('class') || '';
                    svgElement.setAttribute('class', `${existingClass} ${className}`.trim());
                }

                // 將其他 React props 轉為屬性
                Object.entries(props).forEach(([key, value]) => {
                    if (value !== undefined && value !== null) {
                        svgElement.setAttribute(key, value);
                    }
                });

                // 將 DOM 轉回 HTML 字串以供 React 使用
                return <span dangerouslySetInnerHTML={{ __html: svgElement.outerHTML }} style={{ display: 'inline-flex', alignItems: 'center' }} />;
            } catch (e) {
                console.error(`Failed to render icon: ${name}`, e);
                return null;
            }
        };

            'Save', 'Settings', 'List', 'Edit2', 'RotateCcw', 'Filter', 'ArrowUpDown', 
            'ArrowUp', 'ArrowDown', 'Code', 'X', 'Info'
        ];

        const Icons = iconsList.reduce((acc, key) => {
            acc[key] = (props) => <IconWrapper name={key} {...props} />;
            return acc;
        }, {});

        const {

            {"id":"R45.851","organ":"Other","keywords":["R45.851","SUICIDAL IDEATION","SUICIDAL THOUGHTS","自殺意念","想自殺"],"standard":"Suicidal ideations","code":"R45.851","type":"exact","note":""},
            {"id":"R45.1","organ":"Other","keywords":["R45.1","AGITATION","RESTLESSNESS","躁動","焦躁不安"],"standard":"Restlessness and agitation","code":"R45.1","type":"exact","note":""},
            {"id":"R44.3","organ":"Neurological","keywords":["R44.3","HALLUCINATION","HALLUCINATIONS","幻覺"],"standard":"Hallucinations, unspecified","code":"R44.3","type":"broad","note":"若已知精神科診斷，請使用更特定代碼"},
            {"id":"F41.0","organ":"Neurological","keywords":["F41.0","PANIC ATTACK","PANIC DISORDER","恐慌發作","恐慌症"],"standard":"Panic disorder [episodic paroxysmal anxiety]","code":"F41.0","type":"exact","note":""},
            {"id":"F32.A","organ":"Neurological","keywords":["F32.A","DEPRESSION","DEPRESSIVE MOOD","憂鬱症","憂鬱"],"standard":"Depression, unspecified","code":"F32.A","type":"broad","note":"若可指定 major depressive disorder episode/severity，請使用更特定 F32/F33 代碼"}
        ];

        // 模擬的藥物/無關詞彙過濾清單
        const IGNORE_LIST = [
            'ASPIRIN', 'PLAVIX', 'METFORMIN', 'LASIX', 'KCL', 'N/S', 'BOKEY', 'NORVASC', 
            'LIPITOR', 'INSULIN', 'ANTIBIOTICS', 'IV', 'PO', 'BID', 'QID', 'TID', 'PRN', 
            'ADMISSION', 'DISCHARGE', 'MBD', 'OBSERVATION', 'VITALS', 'BP', 'HR', 'RR', 'BT',
            'CURRENT MEDICATIONS', 'ALLERGIES', 'PLAN', 'SOAP'
        ];

        const DEPRECATED_BUILT_IN_IDS = new Set([
            'G20', 'F03.91', 'Z22.51', 'E87.2', 'I27.2', 'I47.1', 'I82.40', 'I71.4',
            'I31.3', 'H10.3', 'M48.0', 'C34.1', 'I48.2', 'I50.2', 'I50.3', 'K21.0',
            'T88.6', 'T88.7', 'K80'
        ]);

        const App = () => {
            // 隱藏的文件上傳 ref
            const fileInputRef = useRef(null);

            // Modal 和 Toast 狀態
            const [modalConfig, setModalConfig] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            const showToast = (msg) => {
                setToastMessage(msg);
            };

            // 核心狀態：Lazy Initialization
            // 合併 localStorage 與最新內建資料，避免舊瀏覽器快取漏掉新 ICD-10 條目。
            const [database, setDatabase] = useState(() => {
                let initialData = [...INITIAL_DATABASE];
                try {
                const savedDb = localStorage.getItem('icd10_custom_db');
                if (savedDb) {
                    const parsed = JSON.parse(savedDb);
                    if (Array.isArray(parsed)) {
                        const savedCustomAndCurrent = parsed.filter(item => item.isCustom || !DEPRECATED_BUILT_IN_IDS.has(item.id));
                        initialData = [...savedCustomAndCurrent, ...INITIAL_DATABASE];
                    }
                }
                } catch (e) {
                console.error("Failed to load initial DB", e);
                }

                // 關鍵修正：確保 id 唯一性
                const uniqueMap = new Map();
                initialData.forEach(item => {
                if (!uniqueMap.has(item.id)) {
                    uniqueMap.set(item.id, {
                        ...item,
                        organ: item.organ || 'Other' 
                    });
                }
                });
                
                return Array.from(uniqueMap.values());
            });

            const [inputText, setInputText] = useState('');
            const [results, setResults] = useState([]);
            const [cursorPosition, setCursorPosition] = useState(0);
            const [isSuggestionOpen, setIsSuggestionOpen] = useState(false);
            
            // UI 狀態
            const [activeTab, setActiveTab] = useState('coding'); 
            const [isProcessing, setIsProcessing] = useState(false);
            const [progressStep, setProgressStep] = useState(0); 

            // 排序狀態
            const [sortConfig, setSortConfig] = useState({ key: 'code', direction: 'asc' });

            // 編輯模式狀態
            const [editingId, setEditingId] = useState(null);

            // 新增/編輯規則表單
            const [newRule, setNewRule] = useState({
                code: '',
                standard: '',
                keywords: '',
                type: 'exact',
                organ: 'Other', 
                note: ''
            });

            // 自動保存：當 database 變更時，同步寫入 localStorage
            useEffect(() => {
                localStorage.setItem('icd10_custom_db', JSON.stringify(database));
            }, [database]);

            // --- 重置/備份/還原/開發者 功能區 ---

            // 智慧重置：保留使用者自訂資料，只還原內建資料
            const handleSmartResetDb = () => {
                setModalConfig({
                title: '確認重置',
                message: '確定要還原系統預設值嗎？\n不用擔心！您的「自訂規則」會被保留下來，只有內建的規則會被重置到最新版本。',
                confirmText: '執行重置',
                confirmColor: 'bg-red-600 hover:bg-red-700',
                onConfirm: () => {
                    const initialIds = new Set(INITIAL_DATABASE.map(item => item.id));
                    const customRules = database.filter(item => !initialIds.has(item.id) && (item.isCustom || !DEPRECATED_BUILT_IN_IDS.has(item.id)));
                    
                    // 合併時也要注意去重複
                    const mergedDb = [...customRules, ...INITIAL_DATABASE];
                    const uniqueMap = new Map();
                    mergedDb.forEach(item => {
                        if(!uniqueMap.has(item.id)){
                            uniqueMap.set(item.id, item);
                        }
                    });

                    setDatabase(Array.from(uniqueMap.values()));
                    setModalConfig(null);
                    showToast(`重置完成！保留了 ${customRules.length} 筆自訂規則。`);
                },
                onCancel: () => setModalConfig(null)
                });
            };

            // 匯出資料庫 (Backup JSON File)
            const handleExportDb = () => {
                const dataStr = JSON.stringify(database, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = `icd10_backup_${new Date().toISOString().slice(0, 10)}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showToast('資料庫備份檔 (.json) 已下載！');
            };

            // 開發者功能：匯出完整資料庫內容 (Copy to Clipboard for Code Update)
            const handleCopyForDeveloper = () => {
                // 移除 isCustom 標記，保持資料乾淨，以便貼回 INITIAL_DATABASE
                const cleanDb = database.map(({ isCustom, ...rest }) => rest);
                const jsonString = JSON.stringify(cleanDb, null, 2);
                
                navigator.clipboard.writeText(jsonString).then(() => {
                showToast('已複製完整資料庫內容！');
                });
            };

            // 匯入資料庫 (Restore)
            const handleImportClick = () => {
                fileInputRef.current.click();
            };

            const handleFileChange = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                    setModalConfig({
                        title: '確認匯入',
                        message: `確定要匯入 ${importedData.length} 筆規則嗎？\n這將會覆蓋您目前的資料庫。`,
                        confirmText: '匯入',
                        onConfirm: () => {
                        // 匯入時同樣進行去重複檢查
                        const uniqueMap = new Map();
                        importedData.forEach(item => {
                            if(item.id && !uniqueMap.has(item.id)){
                                uniqueMap.set(item.id, item);
                            }
                        });
                        setDatabase(Array.from(uniqueMap.values()));
                        setModalConfig(null);
                        showToast('資料庫匯入成功！');
                        },
                        onCancel: () => {
                        setModalConfig(null);
                        // reset file input
                        if(fileInputRef.current) fileInputRef.current.value = '';
                        }
                    });
                    } else {
                    showToast('匯入失敗：檔案格式不正確。');
                    }
                } catch (error) {
                    showToast('匯入失敗：無法讀取檔案。');
                    console.error(error);
                }
                };
                reader.readAsText(file);
                event.target.value = ''; // Ensure onChange fires again for same file if needed
            };

            // -------------------------

            const requestSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') {
                direction = 'desc';
                }
                setSortConfig({ key, direction });
            };

            const sortedDatabase = useMemo(() => {
                let sortableItems = [...database];
                if (sortConfig.key) {
                sortableItems.sort((a, b) => {
                    let valA = a[sortConfig.key] || '';
                    let valB = b[sortConfig.key] || '';
                    
                    if (sortConfig.key === 'organ') {
                    if (valA === 'Other') return 1;
                    if (valB === 'Other') return -1;
                    }

                    if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });
                }
                return sortableItems;
            }, [database, sortConfig]);

            const getActiveSearchTerm = () => {
                const textBeforeCursor = inputText.slice(0, cursorPosition);
                const activeSegment = textBeforeCursor.split(/[\n,;，、/:()?]+/).pop().trim();

                if (activeSegment.length < 2 || !/[A-Za-z]/.test(activeSegment)) {
                    return '';
                }

                return activeSegment;
            };

            const liveSearchTerm = getActiveSearchTerm();

            const liveSuggestions = useMemo(() => {
                if (!liveSearchTerm) return [];

                const query = liveSearchTerm.toUpperCase();
                const isShortEnglishQuery = /^[A-Z0-9]{2,3}$/.test(query);
                const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const shortEnglishRegex = new RegExp(`\\b${escapedQuery}`);

                return database
                    .map(entry => {
                        const searchableTerms = [
                            entry.code,
                            entry.standard,
                            ...(entry.keywords || [])
                        ].filter(Boolean);

                        let bestScore = 0;
                        let matchedText = '';

                        searchableTerms.forEach(term => {
                            const normalized = String(term).toUpperCase();
                            let score = 0;

                            if (normalized === query) {
                                score = 120;
                            } else if (normalized.startsWith(query)) {
                                score = 90;
                            } else if (isShortEnglishQuery && shortEnglishRegex.test(normalized)) {
                                score = 75;
                            } else if (!isShortEnglishQuery && normalized.includes(query)) {
                                score = 55;
                            }

                            if (entry.code.toUpperCase().startsWith(query)) {
                                score += 20;
                            }

                            if (score > bestScore) {
                                bestScore = score;
                                matchedText = term;
                            }
                        });

                        return bestScore > 0 ? { ...entry, bestScore, matchedText } : null;
                    })
                    .filter(Boolean)
                    .sort((a, b) => b.bestScore - a.bestScore || a.code.localeCompare(b.code))
                    .slice(0, 8);
            }, [database, liveSearchTerm]);

            const handleInputChange = (event) => {
                setInputText(event.target.value);
                setCursorPosition(event.target.selectionStart);
                setIsSuggestionOpen(true);
            };

            const handleInputCursorChange = (event) => {
                setCursorPosition(event.target.selectionStart);
                setIsSuggestionOpen(true);
            };

            const insertSuggestion = (suggestion) => {
                const textBeforeCursor = inputText.slice(0, cursorPosition);
                const textAfterCursor = inputText.slice(cursorPosition);
                const segmentStart = Math.max(
                    textBeforeCursor.lastIndexOf('\n'),
                    textBeforeCursor.lastIndexOf(','),
                    textBeforeCursor.lastIndexOf(';'),
                    textBeforeCursor.lastIndexOf('，'),
                    textBeforeCursor.lastIndexOf('、'),
                    textBeforeCursor.lastIndexOf('/'),
                    textBeforeCursor.lastIndexOf(':')
                ) + 1;
                const prefix = inputText.slice(0, segmentStart);
                const insertion = `${suggestion.code} ${suggestion.standard}`;
                const nextText = `${prefix}${insertion}${textAfterCursor}`;

                setInputText(nextText);
                setCursorPosition(prefix.length + insertion.length);
                setIsSuggestionOpen(false);
            };

            const handleAnalyze = () => {
                if (!inputText.trim()) return;
                
                setIsProcessing(true);
                setResults([]);
                setProgressStep(1);

                setTimeout(() => {
                setProgressStep(2);
                setTimeout(() => {
                    setProgressStep(3);
                    setTimeout(() => {
                    performCoding();
                    setIsProcessing(false);
                    setProgressStep(0);
                    }, 500);
                }, 500);
                }, 500);
            };

            const performCoding = () => {
                // 增加切割符號：斜線(/), 冒號(:), 括號()
                const protectedInputText = inputText.replace(/\b([A-Z]\d{2})\.(\d[A-Z0-9]*)\b/gi, '$1§$2');
                const segments = protectedInputText
                    .split(/[\n,;，、。/:().?]+/)
                    .map(s => s.replace(/§/g, '.').trim())
                    .filter(s => s.length > 0);
                const newResults = [];
                const usedCodes = new Set();

                const processSegment = (rawSegment) => {
                const cleanSegment = rawSegment.toUpperCase();
                if (cleanSegment.length < 2) return;
                
                const isIgnored = IGNORE_LIST.some(ignore => {
                    // 如果是短縮寫 (如 PO, IV, BP)，必須全字匹配
                    if (ignore.length <= 4) {
                        const escapedIgnore = ignore.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const regex = new RegExp(`\\b${escapedIgnore}\\b`);
                        return regex.test(cleanSegment);
                    }
                    // 長單字則維持寬鬆匹配
                    return cleanSegment.includes(ignore);
                });

                if (isIgnored) return;

                const matchesByCode = new Map();

                database.forEach(entry => {
                    const searchableTerms = [
                        entry.code,
                        entry.standard,
                        ...(entry.keywords || [])
                    ].filter(Boolean);

                    searchableTerms.forEach(keyword => {
                    const k = keyword.toUpperCase();
                    let isMatch = false;

                    const isEnglishKeyword = /^[A-Z0-9\s\-\.]+$/.test(k);

                    if (isEnglishKeyword) {
                        const escapedK = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const regex = new RegExp(`\\b${escapedK}\\b`);
                        isMatch = regex.test(cleanSegment);
                    } else {
                        isMatch = cleanSegment.includes(k);
                    }

                    if (isMatch) {
                        let currentScore = k.length;
                        
                        if (cleanSegment === k) {
                            currentScore += 100;
                        }

                        const existing = matchesByCode.get(entry.code);
                        if (!existing || currentScore > existing.relevance) {
                        matchesByCode.set(entry.code, {
                            ...entry,
                            original: rawSegment,
                            relevance: currentScore
                        });
                        }
                    }
                    });
                });

                Array.from(matchesByCode.values())
                    .sort((a, b) => b.relevance - a.relevance || a.code.localeCompare(b.code))
                    .forEach(match => {
                    if (!usedCodes.has(match.code)) {
                        const { relevance, ...result } = match;
                        newResults.push(result);
                        usedCodes.add(match.code);
                    }
                    });
                };

                segments.forEach(seg => {
                processSegment(seg);
                });

                setResults(newResults);
            };

            const handleSaveRule = () => {
                if (!newRule.code || !newRule.standard || !newRule.keywords) {
                showToast('請填寫完整資訊 (代碼、標準名稱、關鍵字)');
                return;
                }

                const keywordsArray = newRule.keywords.split(/[,，、]/).map(k => k.trim()).filter(k => k.length > 0);

                const ruleData = {
                keywords: keywordsArray,
                standard: newRule.standard,
                code: newRule.code,
                type: newRule.type,
                organ: newRule.organ,
                note: newRule.note,
                isCustom: true 
                };

                if (editingId) {
                setDatabase(prev => prev.map(item => {
                    if (item.id === editingId) {
                    return { ...item, ...ruleData };
                    }

                                    <div className="mt-1 flex flex-wrap gap-1">
                                        {item.keywords.map((k, i) => (
                                        <span key={i} className="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded border border-slate-200">
                                            {k}
                                        </span>
                                        ))}
                                    </div>
                                    {item.note && <div className="text-[10px] text-amber-600 mt-1 italic">{item.note}</div>}
                                    </td>
                                    <td className="px-4 py-3 text-right align-top whitespace-nowrap">
                                    <button 
                                        onClick={() => handleEditRule(item)}
                                        className={`p-1 rounded transition-colors mr-2 ${
                                        editingId === item.id 
                                            ? 'text-amber-600 bg-amber-100' 
                                            : 'text-slate-400 hover:text-blue-600 hover:bg-blue-50'
                                        }`}
                                        title="編輯"
                                    >
                                        <Edit2 className="w-4 h-4" />
                                    </button>
                                    <button 
                                        onClick={() => handleDeleteRule(item.id)}
                                        className="text-slate-400 hover:text-red-500 p-1 rounded hover:bg-red-50 transition-colors"
                                        title="刪除"
                                    >
                                        <Trash2 className="w-4 h-4" />
                                    </button>
                                    </td>
                                </tr>
                                ))}
                            </tbody>
                            </table>
                        </div>
                        </div>
                    </div>
                    )}

                </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

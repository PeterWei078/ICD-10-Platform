<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>內科醫學編碼互動式平台 (ICD-10-CM)</title>

    <!-- App Icons / PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#0a2540">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ICD-10">

    <!-- Tailwind CSS -->
    <!-- 版本皆鎖定，避免 CDN @latest 自動升級造成 API 失效 -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in-up': 'fadeInUp 0.3s ease-out',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone@7.29.11/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@1.60.0/dist/umd/lucide.min.js"></script>

    <!-- QR Code (同步連結用) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

    <!-- 內建 ICD-10-CM 資料庫 -->
    <script src="data/icd10-data.js"></script>

    <style>
        /* 自定義捲軸樣式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Lucide Icon 轉接層 (修正版) ---
        // 修正說明：Lucide 新版移除了 icon 物件上的 .toSvg() 方法
        // 改用 lucide.createElement() 來生成 DOM，再轉為字串
        const IconWrapper = ({ name, color, size, className, strokeWidth, ...props }) => {
            // Lucide CDN 暴露的是 `lucide.icons` 物件
            const iconDef = lucide.icons[name];
            
            if (!iconDef) {
                console.warn(`Icon ${name} not found`);
                return null;
            }

            try {
                // 使用 Lucide 的 helper 建立 SVG DOM 元素
                const svgElement = lucide.createElement(iconDef);

                // 設定我們需要的屬性 (會覆蓋預設值)
                svgElement.setAttribute('width', size || 24);
                svgElement.setAttribute('height', size || 24);
                svgElement.setAttribute('stroke', color || "currentColor");
                svgElement.setAttribute('stroke-width', strokeWidth || 2);
                
                if (className) {
                    // 處理既有的 class 與傳入的 className
                    const existingClass = svgElement.getAttribute('class') || '';
                    svgElement.setAttribute('class', `${existingClass} ${className}`.trim());
                }

                // 將其他 React props 轉為屬性
                Object.entries(props).forEach(([key, value]) => {
                    if (value !== undefined && value !== null) {
                        svgElement.setAttribute(key, value);
                    }
                });

                // 將 DOM 轉回 HTML 字串以供 React 使用
                return <span dangerouslySetInnerHTML={{ __html: svgElement.outerHTML }} style={{ display: 'inline-flex', alignItems: 'center' }} />;
            } catch (e) {
                console.error(`Failed to render icon: ${name}`, e);
                return null;
            }
        };

        // 建立原始代碼中使用的所有 Icon 元件
        const iconsList = [
            'Stethoscope', 'Search', 'ArrowRight', 'FileText', 'CheckCircle', 'AlertTriangle', 
            'Copy', 'Trash2', 'Database', 'Activity', 'XCircle', 'Download', 'Upload', 'Plus', 
            'Save', 'Settings', 'List', 'Edit2', 'RotateCcw', 'Filter', 'ArrowUpDown', 
            'ArrowUp', 'ArrowDown', 'Code', 'X', 'Info',
            'QrCode', 'Share2', 'Link', 'Zap', 'Layers', 'ChevronDown', 'ChevronUp', 'Smartphone'
        ];

        const Icons = iconsList.reduce((acc, key) => {
            acc[key] = (props) => <IconWrapper name={key} {...props} />;
            return acc;
        }, {});

        const { 
            Stethoscope, Search, ArrowRight, FileText, CheckCircle, AlertTriangle, 
            Copy, Trash2, Database, Activity, XCircle, Download, Upload, Plus, 
            Save, Settings, List, Edit2, RotateCcw, Filter, ArrowUpDown, 
            ArrowUp, ArrowDown, Code, X, Info,
            QrCode, Share2, Link, Zap, Layers, ChevronDown, ChevronUp, Smartphone
        } = Icons;

        // --- 原始應用程式代碼開始 ---

        // 1. 提示訊息 (Toast)
        const Toast = ({ message, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className="fixed bottom-5 right-5 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center z-[100] animate-fade-in-up">
                    <Info className="w-5 h-5 mr-3 text-blue-400" />
                    <span className="text-sm font-medium">{message}</span>
                    <button onClick={onClose} className="ml-4 text-slate-400 hover:text-white">
                        <X className="w-4 h-4" />
                    </button>
                </div>
            );
        };

        // 2. 確認對話框 (Modal)
        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel, confirmText = "確定", confirmColor = "bg-blue-600 hover:bg-blue-700" }) => {
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] backdrop-blur-sm p-4">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden transform transition-all scale-100">
                        <div className="p-6">
                            <h3 className="text-lg font-bold text-slate-800 mb-2">{title}</h3>
                            <p className="text-sm text-slate-600 whitespace-pre-line leading-relaxed">{message}</p>
                        </div>
                        <div className="bg-slate-50 px-6 py-4 flex justify-end space-x-3">
                            <button 
                                onClick={onCancel}
                                className="px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-50 transition-colors"
                            >
                                取消
                            </button>
                            <button 
                                onClick={onConfirm}
                                className={`px-4 py-2 text-white rounded-lg text-sm font-medium shadow-sm transition-colors ${confirmColor}`}
                            >
                                {confirmText}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 定義器官/系統分類
        const ORGAN_CATEGORIES = [
            { value: 'Respiratory', label: '呼吸系統 (Respiratory)', color: 'bg-teal-100 text-teal-800' },
            { value: 'Cardiovascular', label: '心血管系統 (Cardiovascular)', color: 'bg-rose-100 text-rose-800' },
            { value: 'Renal', label: '腎臟泌尿 (Renal/Urinary)', color: 'bg-blue-100 text-blue-800' },
            { value: 'Digestive', label: '消化系統 (Digestive)', color: 'bg-orange-100 text-orange-800' },
            { value: 'Endocrine', label: '內分泌代謝 (Endocrine)', color: 'bg-yellow-100 text-yellow-800' },
            { value: 'Neurological', label: '神經系統 (Neurological)', color: 'bg-purple-100 text-purple-800' },
            { value: 'Surgical', label: '骨科/外科 (Surgical/Orthopedic)', color: 'bg-cyan-100 text-cyan-800' },
            { value: 'Infectious', label: '感染/敗血症 (Infectious)', color: 'bg-red-100 text-red-800' },
            { value: 'Other', label: '其他 (Other)', color: 'bg-slate-100 text-slate-800' }
        ];

        // 內建資料由 data/icd10-data.js 提供 (window.ICD10_DATA)
        const ICD10_DATA = window.ICD10_DATA || null;
        const INITIAL_DATABASE = ICD10_DATA ? ICD10_DATA.entries : [];
        const COMMON_CODE_GROUPS = ICD10_DATA ? (ICD10_DATA.commonCodes || []) : [];
        const CODE_BUNDLES = ICD10_DATA ? (ICD10_DATA.bundles || []) : [];
        const DATA_VERSION = ICD10_DATA ? ICD10_DATA.version : '';
        const BUILT_IN_IDS = new Set(INITIAL_DATABASE.map(item => item.id));

        // 模擬的藥物/無關詞彙過濾清單
        const IGNORE_LIST = [
            'ASPIRIN', 'PLAVIX', 'METFORMIN', 'LASIX', 'KCL', 'N/S', 'BOKEY', 'NORVASC', 
            'LIPITOR', 'INSULIN', 'ANTIBIOTICS', 'IV', 'PO', 'BID', 'QID', 'TID', 'PRN', 
            'ADMISSION', 'DISCHARGE', 'MBD', 'OBSERVATION', 'VITALS', 'BP', 'HR', 'RR', 'BT',
            'CURRENT MEDICATIONS', 'ALLERGIES', 'PLAN', 'SOAP'
        ];

const DEPRECATED_BUILT_IN_IDS = new Set(ICD10_DATA ? ICD10_DATA.deprecatedIds : []);

        // --- 語意修飾詞偵測 (NegEx-lite) ---
        // scope 'after'：修飾其後方的診斷 (No DM)；scope 'before'：修飾其前方的診斷 (糖尿病病史)
        // 修飾詞若落在匹配的關鍵字本身之內 (如 "SUSPECTED FLU")，不會套用。
        const QUALIFIER_TRIGGERS = [
            { re: /\b(NO|NOT|DENIES|DENIED|DENY|NEGATIVE FOR|FREE OF|ABSENCE OF|RULED OUT)\b/g, type: 'negated', scope: 'after' },
            { re: /^\s*(WITHOUT|W\/O)\b/g, type: 'negated', scope: 'after' },
            { re: /(否認|沒有|未見|無明顯|已排除)/g, type: 'negated', scope: 'after' },
            { re: /^\s*無(?=\s|[A-Z])/g, type: 'negated', scope: 'after' },
            { re: /\b(R\/O|RULE OUT|SUSPECTED|SUSPECT|SUSPICIOUS FOR|POSSIBLE|PROBABLE|LIKELY|QUESTIONABLE)\b/g, type: 'uncertain', scope: 'after' },
            { re: /(疑似|懷疑|待排除|(?<!已)排除|可能)/g, type: 'uncertain', scope: 'after' },
            { re: /\b(HX OF|H\/O|HISTORY OF|S\/P|STATUS POST|PREVIOUS|PRIOR)\b/g, type: 'history', scope: 'after' },
            { re: /(曾有|曾經|過去有)/g, type: 'history', scope: 'after' },
            { re: /(病史|術後)/g, type: 'history', scope: 'before' }
        ];
        // 轉折詞：中斷修飾詞的作用範圍 (No fever but DM → DM 不被否定)
        const QUALIFIER_TERMINATORS = /\b(BUT|HOWEVER|EXCEPT)\b|但是|但|卻/g;
        // 狀態/病史類 Z 碼本身就代表病史，不再標記為「病史」
        const STATUS_CODE_REGEX = /^Z(79|8\d|9\d)/;
        const QUALIFIER_RANK = { none: 0, history: 1, uncertain: 1, negated: 2 };

        const findAllMatches = (re, text) => {
            const out = [];
            re.lastIndex = 0;
            let m;
            while ((m = re.exec(text)) !== null) {
                out.push({ start: m.index, end: m.index + m[0].length });
                if (m[0].length === 0) re.lastIndex++;
            }
            return out;
        };

        const detectQualifier = (segment, matchStart, matchEnd) => {
            const terminators = findAllMatches(QUALIFIER_TERMINATORS, segment);
            const blocked = (from, to) => terminators.some(t => t.start >= from && t.end <= to);
            let best = null; // { type, distance }

            QUALIFIER_TRIGGERS.forEach(({ re, type, scope }) => {
                findAllMatches(re, segment).forEach(t => {
                    let distance = null;
                    if (scope === 'after' && t.end <= matchStart && !blocked(t.end, matchStart)) {
                        distance = matchStart - t.end;
                    } else if (scope === 'before' && t.start >= matchEnd && !blocked(matchEnd, t.start)) {
                        distance = t.start - matchEnd;
                    }
                    if (distance !== null && (!best || distance < best.distance)) {
                        best = { type, distance };
                    }
                });
            });

            return best ? best.type : null;
        };

        const QUALIFIER_LABELS = {
            uncertain: { text: '疑似 / R/O', className: 'bg-amber-100 text-amber-800' },
            history: { text: '病史 / 術後', className: 'bg-indigo-100 text-indigo-800' },
            negated: { text: '否定', className: 'bg-slate-200 text-slate-600' }
        };

        // --- 規則同步：將自訂規則壓縮成網址 hash (#rules=z.xxxx) ---
        // hash 不會送到伺服器，資料只在兩台裝置之間傳遞
        const bytesToBase64Url = (bytes) => {
            let binary = '';
            for (let i = 0; i < bytes.length; i += 0x8000) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            }
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        };

        const base64UrlToBytes = (text) => {
            const b64 = text.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((text.length + 3) % 4);
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        };

        const canCompress = typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';

        const encodeRulesPayload = async (rules) => {
            const json = JSON.stringify(rules.map(({ isCustom, ...rest }) => rest));
            const bytes = new TextEncoder().encode(json);
            if (canCompress) {
                const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
                const compressed = new Uint8Array(await new Response(stream).arrayBuffer());
                return `z.${bytesToBase64Url(compressed)}`;
            }
            return `j.${bytesToBase64Url(bytes)}`;
        };

        const RULES_LINK_REGEX = /#rules=([zj])\.([A-Za-z0-9_-]+)/;

        const decodeRulesPayload = async (mode, data) => {
            let bytes = base64UrlToBytes(data);
            if (mode === 'z') {
                if (!canCompress) throw new Error('此瀏覽器不支援解壓縮');
                const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
                bytes = new Uint8Array(await new Response(stream).arrayBuffer());
            }
            const parsed = JSON.parse(new TextDecoder().decode(bytes));
            if (!Array.isArray(parsed)) throw new Error('格式錯誤');
            return parsed.filter(r => r && r.id && r.code && r.standard && Array.isArray(r.keywords));
        };

        const makeQrSvg = (text) => {
            // 超過約 1200 字元的 QR 在螢幕上過於密集難以掃描，改用連結/分享
            if (typeof qrcode !== 'function' || text.length > 1200) return null;
            try {
                const qr = qrcode(0, 'L');
                qr.addData(text);
                qr.make();
                return qr.createSvgTag(4, 8);
            } catch (e) {
                return null; // 內容超過 QR 容量
            }
        };

        const App = () => {
            // 隱藏的文件上傳 ref
            const fileInputRef = useRef(null);

            // Modal 和 Toast 狀態
            const [modalConfig, setModalConfig] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            const showToast = (msg) => {
                setToastMessage(msg);
            };

            // 核心狀態：Lazy Initialization
            // 合併 localStorage 與最新內建資料，避免舊瀏覽器快取漏掉新 ICD-10 條目。
            const [database, setDatabase] = useState(() => {
                let initialData = [...INITIAL_DATABASE];
                try {
                const savedDb = localStorage.getItem('icd10_custom_db');
                if (savedDb) {
                    const parsed = JSON.parse(savedDb);
                    if (Array.isArray(parsed)) {
                        // 只保留「使用者自訂/修改過」或「非內建」的條目；
                        // 未修改的內建條目一律改用最新 INITIAL_DATABASE，確保內建更新能送達舊用戶。
                        const builtInIds = new Set(INITIAL_DATABASE.map(item => item.id));
                        const savedUserEntries = parsed.filter(item =>
                            item && item.id && (
                                item.isCustom ||
                                (!builtInIds.has(item.id) && !DEPRECATED_BUILT_IN_IDS.has(item.id))
                            )
                        );
                        initialData = [...savedUserEntries, ...INITIAL_DATABASE];
                    }
                }
                } catch (e) {
                console.error("Failed to load initial DB", e);
                }

                // 關鍵修正：確保 id 唯一性
                const uniqueMap = new Map();
                initialData.forEach(item => {
                if (!uniqueMap.has(item.id)) {
                    uniqueMap.set(item.id, {
                        ...item,
                        organ: item.organ || 'Other' 
                    });
                }
                });
                
                return Array.from(uniqueMap.values());
            });

            const [inputText, setInputText] = useState('');
            const [results, setResults] = useState([]);
            const [cursorPosition, setCursorPosition] = useState(0);
            const [isSuggestionOpen, setIsSuggestionOpen] = useState(false);
            
            // UI 狀態
            const [activeTab, setActiveTab] = useState('coding'); 
            const [isProcessing, setIsProcessing] = useState(false);
            const [progressStep, setProgressStep] = useState(0); 

            // 排序狀態
            const [sortConfig, setSortConfig] = useState({ key: 'code', direction: 'asc' });

            // 編輯模式狀態
            const [editingId, setEditingId] = useState(null);

            // 新增/編輯規則表單
            const [newRule, setNewRule] = useState({
                code: '',
                standard: '',
                keywords: '',
                type: 'exact',
                organ: 'Other', 
                note: ''
            });

            // 自動保存：當 database 變更時，同步寫入 localStorage
            useEffect(() => {
                try {
                    localStorage.setItem('icd10_custom_db', JSON.stringify(database));
                } catch (e) {
                    console.error('Failed to save DB', e);
                }
            }, [database]);

            // --- 規則同步 (連結 / QR) ---
            const [syncInfo, setSyncInfo] = useState(null); // { count, url, qrSvg } | null
            const [syncPasteText, setSyncPasteText] = useState('');

            // 使用者規則 = 自訂/修改過的條目 + 非內建條目
            const getUserRules = () => database.filter(item => item.isCustom || !BUILT_IN_IDS.has(item.id));

            const openSyncPanel = async () => {
                const rules = getUserRules();
                setSyncPasteText('');
                if (rules.length === 0) {
                    setSyncInfo({ count: 0, url: '', qrSvg: null });
                    return;
                }
                try {
                    const payload = await encodeRulesPayload(rules);
                    const url = `${window.location.href.split('#')[0]}#rules=${payload}`;
                    setSyncInfo({ count: rules.length, url, qrSvg: makeQrSvg(url) });
                } catch (e) {
                    console.error(e);
                    showToast('產生同步連結失敗');
                }
            };

            const copySyncLink = () => {
                if (!syncInfo || !syncInfo.url) return;
                navigator.clipboard.writeText(syncInfo.url).then(() => showToast('同步連結已複製'));
            };

            const shareSyncLink = () => {
                if (!syncInfo || !syncInfo.url || !navigator.share) return;
                navigator.share({ title: 'ICD-10 自訂規則同步', text: `${syncInfo.count} 筆自訂規則`, url: syncInfo.url })
                    .catch(() => {});
            };

            // 解析連結並詢問是否合併匯入；onDone 用於清除網址 hash
            const startLinkImport = (text, onDone = () => {}) => {
                const match = String(text || '').match(RULES_LINK_REGEX);
                if (!match) {
                    showToast('找不到有效的同步連結');
                    onDone();
                    return;
                }
                decodeRulesPayload(match[1], match[2]).then(rules => {
                    if (rules.length === 0) {
                        showToast('連結中沒有可匯入的規則');
                        onDone();
                        return;
                    }
                    setSyncInfo(null);
                    setModalConfig({
                        title: '從同步連結匯入',
                        message: `偵測到 ${rules.length} 筆自訂規則。\n要合併到這台裝置的規則庫嗎？\n（相同 id 的規則會被連結內容取代，其餘規則保留）`,
                        confirmText: '合併匯入',
                        onConfirm: () => {
                            const importedIds = new Set(rules.map(r => r.id));
                            setDatabase(prev => [
                                ...rules.map(r => ({ ...r, organ: r.organ || 'Other', isCustom: true })),
                                ...prev.filter(item => !importedIds.has(item.id))
                            ]);
                            setModalConfig(null);
                            onDone();
                            showToast(`已匯入 ${rules.length} 筆規則`);
                        },
                        onCancel: () => {
                            setModalConfig(null);
                            onDone();
                        }
                    });
                }).catch(e => {
                    console.error(e);
                    showToast('同步連結無法解析');
                    onDone();
                });
            };

            // 開啟帶有 #rules= 的網址時自動詢問匯入
            useEffect(() => {
                if (!RULES_LINK_REGEX.test(window.location.hash)) return;
                startLinkImport(window.location.hash, () => {
                    window.history.replaceState(null, '', window.location.pathname + window.location.search);
                });
            }, []);

            // --- 重置/備份/還原/開發者 功能區 ---

            // 智慧重置：保留使用者自訂資料，只還原內建資料
            const handleSmartResetDb = () => {
                setModalConfig({
                title: '確認重置',
                message: '確定要還原系統預設值嗎？\n不用擔心！您的「自訂規則」會被保留下來，只有內建的規則會被重置到最新版本。',
                confirmText: '執行重置',
                confirmColor: 'bg-red-600 hover:bg-red-700',
                onConfirm: () => {
                    const initialIds = new Set(INITIAL_DATABASE.map(item => item.id));
                    const customRules = database.filter(item => !initialIds.has(item.id) && (item.isCustom || !DEPRECATED_BUILT_IN_IDS.has(item.id)));
                    
                    // 合併時也要注意去重複
                    const mergedDb = [...customRules, ...INITIAL_DATABASE];
                    const uniqueMap = new Map();
                    mergedDb.forEach(item => {
                        if(!uniqueMap.has(item.id)){
                            uniqueMap.set(item.id, item);
                        }
                    });

                    setDatabase(Array.from(uniqueMap.values()));
                    setModalConfig(null);
                    showToast(`重置完成！保留了 ${customRules.length} 筆自訂規則。`);
                },
                onCancel: () => setModalConfig(null)
                });
            };

            // 匯出資料庫 (Backup JSON File)
            const handleExportDb = () => {
                const dataStr = JSON.stringify(database, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = `icd10_backup_${new Date().toISOString().slice(0, 10)}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showToast('資料庫備份檔 (.json) 已下載！');
            };

            // 開發者功能：匯出完整資料庫內容 (Copy to Clipboard for Code Update)
            const handleCopyForDeveloper = () => {
                // 移除 isCustom 標記，保持資料乾淨，以便貼回 INITIAL_DATABASE
                const cleanDb = database.map(({ isCustom, ...rest }) => rest);
                const jsonString = JSON.stringify(cleanDb, null, 2);
                
                navigator.clipboard.writeText(jsonString).then(() => {
                showToast('已複製完整資料庫內容！');
                });
            };

            // 匯入資料庫 (Restore)
            const handleImportClick = () => {
                fileInputRef.current.click();
            };

            const handleFileChange = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                    setModalConfig({
                        title: '確認匯入',
                        message: `確定要匯入 ${importedData.length} 筆規則嗎？\n這將會覆蓋您目前的資料庫。`,
                        confirmText: '匯入',
                        onConfirm: () => {
                        // 匯入時同樣進行去重複檢查
                        const uniqueMap = new Map();
                        importedData.forEach(item => {
                            if(item.id && !uniqueMap.has(item.id)){
                                uniqueMap.set(item.id, item);
                            }
                        });
                        setDatabase(Array.from(uniqueMap.values()));
                        setModalConfig(null);
                        showToast('資料庫匯入成功！');
                        },
                        onCancel: () => {
                        setModalConfig(null);
                        // reset file input
                        if(fileInputRef.current) fileInputRef.current.value = '';
                        }
                    });
                    } else {
                    showToast('匯入失敗：檔案格式不正確。');
                    }
                } catch (error) {
                    showToast('匯入失敗：無法讀取檔案。');
                    console.error(error);
                }
                };
                reader.readAsText(file);
                event.target.value = ''; // Ensure onChange fires again for same file if needed
            };

            // -------------------------

            const requestSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') {
                direction = 'desc';
                }
                setSortConfig({ key, direction });
            };

            const sortedDatabase = useMemo(() => {
                let sortableItems = [...database];
                if (sortConfig.key) {
                sortableItems.sort((a, b) => {
                    let valA = a[sortConfig.key] || '';
                    let valB = b[sortConfig.key] || '';
                    
                    if (sortConfig.key === 'organ') {
                    if (valA === 'Other') return 1;
                    if (valB === 'Other') return -1;
                    }

                    if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });
                }
                return sortableItems;
            }, [database, sortConfig]);

            // 規則庫搜尋與系統篩選
            const [dbQuery, setDbQuery] = useState('');
            const [dbOrgan, setDbOrgan] = useState('all');

            const filteredDatabase = useMemo(() => {
                const q = dbQuery.trim().toUpperCase();
                return sortedDatabase.filter(item => {
                    if (dbOrgan !== 'all' && (item.organ || 'Other') !== dbOrgan) return false;
                    if (!q) return true;
                    return [item.code, item.standard, item.note, ...(item.keywords || [])]
                        .some(t => t && String(t).toUpperCase().includes(q));
                });
            }, [sortedDatabase, dbQuery, dbOrgan]);

            // 取得游標所在片段：回傳 { query, segmentStart, queryStart }
            // 斜線縮寫 (R/O、S/P) 以等長字元保護，片段開頭的修飾詞不列入搜尋字串
            const LIVE_SEPARATOR_REGEX = /[\n,;，、/:()?]/;
            const LIVE_PREFIX_REGEX = /^(R\/O|S\/P|H\/O|HX OF|HISTORY OF|NO|DENIES|DENIED|SUSPECTED|POSSIBLE|RULE OUT|疑似|懷疑|否認|沒有|待排除|排除|曾有)\s*/i;

            const getActiveSearchInfo = () => {
                const empty = { query: '', segmentStart: 0, queryStart: 0 };
                const textBeforeCursor = inputText
                    .slice(0, cursorPosition)
                    .replace(/\b([RSHW])\/([OP])\b/gi, '$1¤$2');

                let segmentStart = 0;
                for (let i = textBeforeCursor.length - 1; i >= 0; i--) {
                    if (LIVE_SEPARATOR_REGEX.test(textBeforeCursor[i])) {
                        segmentStart = i + 1;
                        break;
                    }
                }

                const rawSegment = textBeforeCursor.slice(segmentStart).replace(/¤/g, '/');
                const leading = rawSegment.length - rawSegment.trimStart().length;
                let segment = rawSegment.trim();
                let prefixLength = 0;
                const prefixMatch = segment.match(LIVE_PREFIX_REGEX);
                if (prefixMatch && prefixMatch[0].length < segment.length) {
                    prefixLength = prefixMatch[0].length;
                    segment = segment.slice(prefixLength);
                }

                if (segment.length < 2 || !/[A-Za-z一-鿿]/.test(segment)) {
                    return empty;
                }

                return { query: segment, segmentStart, queryStart: segmentStart + leading + prefixLength, hasPrefix: prefixLength > 0 };
            };

            const liveSearchInfo = getActiveSearchInfo();
            const liveSearchTerm = liveSearchInfo.query;

            const liveSuggestions = useMemo(() => {
                if (!liveSearchTerm) return [];

                const query = liveSearchTerm.toUpperCase();
                const isShortEnglishQuery = /^[A-Z0-9]{2,3}$/.test(query);
                const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const shortEnglishRegex = new RegExp(`\\b${escapedQuery}`);
                const isCJKQuery = /[\u4e00-\u9fff]/.test(query);

                return database
                    .map(entry => {
                        const searchableTerms = [
                            entry.code,
                            entry.standard,
                            ...(entry.keywords || [])
                        ].filter(Boolean);

                        let bestScore = 0;
                        let matchedText = '';
                        let matchOffset = 0;

                        searchableTerms.forEach(term => {
                            const normalized = String(term).toUpperCase();
                            let score = 0;
                            let offset = 0;

                            if (normalized === query) {
                                score = 120;
                            } else if (normalized.startsWith(query)) {
                                score = 90;
                            } else if (isShortEnglishQuery && shortEnglishRegex.test(normalized)) {
                                score = 75;
                            } else if (!isShortEnglishQuery && normalized.includes(query)) {
                                score = 55;
                            } else if (isCJKQuery && normalized.length >= 2 && /[\u4e00-\u9fff]/.test(normalized) && query.includes(normalized)) {
                                // 中文連續句 (如「病人有糖尿病」)：句中包含關鍵字，只替換關鍵字部分
                                score = 40 + normalized.length;
                                offset = query.lastIndexOf(normalized);
                            }

                            if (entry.code.toUpperCase().startsWith(query)) {
                                score += 20;
                            }

                            if (score > bestScore) {
                                bestScore = score;
                                matchedText = term;
                                matchOffset = offset;
                            }
                        });

                        return bestScore > 0 ? { ...entry, bestScore, matchedText, matchOffset } : null;
                    })
                    .filter(Boolean)
                    .sort((a, b) =>
                        b.bestScore - a.bestScore ||
                        String(a.matchedText).length - String(b.matchedText).length ||
                        a.code.localeCompare(b.code)
                    )
                    .slice(0, 8);
            }, [database, liveSearchTerm]);

            const handleInputChange = (event) => {
                setInputText(event.target.value);
                setCursorPosition(event.target.selectionStart);
                setIsSuggestionOpen(true);
            };

            const handleInputCursorChange = (event) => {
                setCursorPosition(event.target.selectionStart);
                setIsSuggestionOpen(true);
            };

            const insertSuggestion = (suggestion) => {
                const textAfterCursor = inputText.slice(cursorPosition);
                const { segmentStart, queryStart, hasPrefix } = liveSearchInfo;
                // 一般情況沿用舊行為 (從片段起點替換)；有前置修飾詞或中文句中匹配時，只替換匹配部分
                const replaceStart = (hasPrefix || suggestion.matchOffset)
                    ? queryStart + (suggestion.matchOffset || 0)
                    : segmentStart;
                const prefix = inputText.slice(0, replaceStart);
                const insertion = `${suggestion.code} ${suggestion.standard}`;
                const nextText = `${prefix}${insertion}${textAfterCursor}`;

                setInputText(nextText);
                setCursorPosition(prefix.length + insertion.length);
                setIsSuggestionOpen(false);
            };

            const handleAnalyze = () => {
                if (!inputText.trim()) return;
                
                setIsProcessing(true);
                setResults([]);
                setProgressStep(1);

                setTimeout(() => {
                setProgressStep(2);
                setTimeout(() => {
                    setProgressStep(3);
                    setTimeout(() => {
                    performCoding();
                    setIsProcessing(false);
                    setProgressStep(0);
                    }, 500);
                }, 500);
                }, 500);
            };

            const performCoding = () => {
                // 保護 ICD 小數點 (E03.9) 與常見斜線縮寫 (R/O, S/P, H/O, W/O)，避免被切割符號拆開
                const protectedInputText = inputText
                    .replace(/\b([A-Z]\d{2})\.(\d[A-Z0-9]*)\b/gi, '$1§$2')
                    .replace(/\b([RSHW])\/([OP])\b/gi, '$1¤$2');
                const segments = protectedInputText
                    .split(/[\n,;，、。/:().?]+/)
                    .map(s => s.replace(/§/g, '.').replace(/¤/g, '/').trim())
                    .filter(s => s.length > 0);

                // 預先編譯忽略清單 (藥物、頻次等)：只遮蔽該詞本身，不再整段丟棄
                const ignoreRegexes = IGNORE_LIST.map(ignore => {
                    const escaped = ignore.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    return { re: new RegExp(`\\b${escaped}\\b`, 'g'), wordRe: new RegExp(`\\b${escaped}\\b`) };
                });

                const collected = [];

                const processSegment = (rawSegment) => {
                const cleanSegment = rawSegment.toUpperCase();
                if (cleanSegment.length < 2) return;

                // 將忽略詞替換為等長的 #，保留字元位置以便判斷修飾詞距離
                let maskedSegment = cleanSegment;
                ignoreRegexes.forEach(({ re }) => {
                    maskedSegment = maskedSegment.replace(re, m => '#'.repeat(m.length));
                });

                const matchesByCode = new Map();

                database.forEach(entry => {
                    const searchableTerms = [
                        entry.code,
                        entry.standard,
                        ...(entry.keywords || [])
                    ].filter(Boolean);

                    searchableTerms.forEach(keyword => {
                    const k = String(keyword).toUpperCase();
                    // 關鍵字本身含忽略詞 (如 "INSULIN USE") 時，比對原文；否則比對遮蔽後文字
                    const target = ignoreRegexes.some(({ wordRe }) => wordRe.test(k)) ? cleanSegment : maskedSegment;
                    let matchStart = -1;

                    const isEnglishKeyword = /^[A-Z0-9\s\-\.]+$/.test(k);

                    if (isEnglishKeyword) {
                        const escapedK = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const m = new RegExp(`\\b${escapedK}\\b`).exec(target);
                        if (m) matchStart = m.index;
                    } else {
                        matchStart = target.indexOf(k);
                    }

                    if (matchStart >= 0) {
                        let currentScore = k.length;
                        
                        if (cleanSegment === k) {
                            currentScore += 100;
                        }

                        const existing = matchesByCode.get(entry.code);
                        if (!existing || currentScore > existing.relevance) {
                        matchesByCode.set(entry.code, {
                            ...entry,
                            original: rawSegment,
                            relevance: currentScore,
                            matchStart,
                            matchEnd: matchStart + k.length
                        });
                        }
                    }
                    });
                });

                Array.from(matchesByCode.values())
                    .sort((a, b) => b.relevance - a.relevance || a.code.localeCompare(b.code))
                    .forEach(match => {
                    const { relevance, matchStart, matchEnd, ...result } = match;
                    let qualifier = detectQualifier(cleanSegment, matchStart, matchEnd);
                    if (qualifier === 'history' && STATUS_CODE_REGEX.test(result.code)) {
                        qualifier = null;
                    }
                    collected.push({ ...result, qualifier });
                    });
                };

                segments.forEach(seg => {
                processSegment(seg);
                });

                // 同一代碼只保留一次：確定 > 疑似/病史 > 否定
                const newResults = [];
                const indexByCode = new Map();
                collected.forEach(item => {
                    const rank = QUALIFIER_RANK[item.qualifier || 'none'];
                    if (!indexByCode.has(item.code)) {
                        indexByCode.set(item.code, newResults.length);
                        newResults.push(item);
                    } else {
                        const idx = indexByCode.get(item.code);
                        if (rank < QUALIFIER_RANK[newResults[idx].qualifier || 'none']) {
                            newResults[idx] = item;
                        }
                    }
                });

                setResults(newResults);
            };

            const handleSaveRule = () => {
                if (!newRule.code || !newRule.standard || !newRule.keywords) {
                showToast('請填寫完整資訊 (代碼、標準名稱、關鍵字)');
                return;
                }

                const keywordsArray = newRule.keywords.split(/[,，、]/).map(k => k.trim()).filter(k => k.length > 0);

                const ruleData = {
                keywords: keywordsArray,
                standard: newRule.standard,
                code: newRule.code,
                type: newRule.type,
                organ: newRule.organ,
                note: newRule.note,
                isCustom: true 
                };

                if (editingId) {
                setDatabase(prev => prev.map(item => {
                    if (item.id === editingId) {
                    return { ...item, ...ruleData };
                    }
                    return item;
                }));
                showToast('更新成功！已保存至瀏覽器。');
                handleCancelEdit();
                } else {
                const newItem = {
                    id: Date.now().toString(),
                    ...ruleData
                };
                setDatabase(prev => [newItem, ...prev]); 
                showToast('新增成功！已保存至瀏覽器。');
                setNewRule({ code: '', standard: '', keywords: '', type: 'exact', organ: 'Other', note: '' });
                }
            };

            const handleEditRule = (rule) => {
                setEditingId(rule.id);
                setNewRule({
                code: rule.code,
                standard: rule.standard,
                keywords: rule.keywords.join(', '),
                type: rule.type,
                organ: rule.organ || 'Other',
                note: rule.note || ''
                });
            };

            const handleCancelEdit = () => {
                setEditingId(null);
                setNewRule({ code: '', standard: '', keywords: '', type: 'exact', organ: 'Other', note: '' });
            };

            const handleDeleteRule = (id) => {
                setModalConfig({
                title: '刪除確認',
                message: '確定要刪除這條規則嗎？此動作無法復原。',
                confirmText: '刪除',
                confirmColor: 'bg-red-600 hover:bg-red-700',
                onConfirm: () => {
                    setDatabase(prev => prev.filter(item => item.id !== id));
                    if (editingId === id) {
                    handleCancelEdit();
                    }
                    setModalConfig(null);
                    showToast('規則已刪除');
                },
                onCancel: () => setModalConfig(null)
                });
            };

            const clearAll = () => {
                setInputText('');
                setResults([]);
                setProgressStep(0);
            };

            const confirmedResults = results.filter(r => !r.qualifier);
            const flaggedResults = results.filter(r => r.qualifier === 'uncertain' || r.qualifier === 'history');
            const negatedResults = results.filter(r => r.qualifier === 'negated');

            // 將「需確認 / 否定」的結果改為確定診斷
            const confirmResult = (code) => {
                setResults(prev => prev.map(r => r.code === code ? { ...r, qualifier: null } : r));
            };

            const removeResult = (code) => {
                setResults(prev => prev.filter(r => r.code !== code));
            };

            // --- 常用快選 / 組合碼 ---
            const [isQuickPickOpen, setIsQuickPickOpen] = useState(() => {
                try { return localStorage.getItem('icd10_quickpick_open') !== '0'; } catch (e) { return true; }
            });
            const [quickPickTab, setQuickPickTab] = useState('common'); // 'common' | 'bundles'

            useEffect(() => {
                try { localStorage.setItem('icd10_quickpick_open', isQuickPickOpen ? '1' : '0'); } catch (e) {}
            }, [isQuickPickOpen]);

            const confirmedCodeSet = new Set(confirmedResults.map(r => r.code));

            const addCodesToResults = (codes, sourceLabel) => {
                const entries = codes
                    .map(code => database.find(entry => entry.code === code))
                    .filter(Boolean);
                if (entries.length === 0) {
                    showToast('規則庫中找不到這些代碼');
                    return;
                }
                setResults(prev => {
                    const next = [...prev];
                    entries.forEach(entry => {
                        const idx = next.findIndex(r => r.code === entry.code);
                        if (idx >= 0) {
                            next[idx] = { ...next[idx], qualifier: null };
                        } else {
                            next.push({ ...entry, original: sourceLabel, qualifier: null });
                        }
                    });
                    return next;
                });
                showToast(entries.length === 1 ? `已加入 ${entries[0].code}` : `已加入 ${entries.length} 個代碼`);
            };

            const copyToClipboard = () => {
                const text = confirmedResults.map(r => `${r.code} - ${r.standard}`).join('\n');
                navigator.clipboard.writeText(text);
                showToast(`已複製 ${confirmedResults.length} 筆確定診斷`);
            };

            const getOrganColor = (organValue) => {
                const category = ORGAN_CATEGORIES.find(c => c.value === organValue);
                return category ? category.color : 'bg-slate-100 text-slate-800';
            };
            
            const getOrganLabel = (organValue) => {
                const category = ORGAN_CATEGORIES.find(c => c.value === organValue);
                return category ? category.label.split(' ')[0] : organValue; 
            };

            const renderResultCard = (item) => {
                const qualifierLabel = item.qualifier ? QUALIFIER_LABELS[item.qualifier] : null;
                return (
                    <div key={item.code} className={`relative p-4 rounded-lg border-l-4 shadow-sm bg-white ${
                    qualifierLabel ? 'border-l-slate-300 border border-dashed border-slate-300 opacity-90' :
                    item.type === 'unknown' ? 'border-l-red-400 border border-red-100' :
                    item.type === 'broad' ? 'border-l-amber-400 border border-amber-100' : 
                    'border-l-green-500 border border-slate-100'
                    }`}>
                    <div className="flex justify-between items-start mb-2">
                        <div className="flex flex-col">
                        <span className="text-xs font-mono bg-slate-100 text-slate-500 px-2 py-0.5 rounded w-fit mb-1">原始: {item.original}</span>
                        <div className="flex flex-wrap gap-1">
                            {qualifierLabel && (
                            <span className={`text-[10px] w-fit px-2 py-0.5 rounded-full font-bold ${qualifierLabel.className}`}>
                                {qualifierLabel.text}
                            </span>
                            )}
                            {item.organ && item.organ !== 'Other' && (
                            <span className={`text-[10px] w-fit px-2 py-0.5 rounded-full ${getOrganColor(item.organ)}`}>
                                {getOrganLabel(item.organ)}
                            </span>
                            )}
                        </div>
                        </div>
                        <div className="flex items-center gap-1">
                        <span className={`text-xl font-bold font-mono ${item.type === 'unknown' ? 'text-red-600' : 'text-blue-700'}`}>{item.code}</span>
                        <button onClick={() => removeResult(item.code)} className="p-1 text-slate-300 hover:text-red-500" title="移除此筆">
                            <X className="w-4 h-4" />
                        </button>
                        </div>
                    </div>
                    <h3 className="text-lg font-semibold text-slate-800 mb-1">{item.standard}</h3>
                    {item.note && (
                        <div className="mt-2 text-xs flex items-start bg-amber-50 text-amber-800 p-2 rounded">
                        <AlertTriangle className="w-3 h-3 mr-1.5 mt-0.5 flex-shrink-0" />
                        {item.note}
                        </div>
                    )}
                    {item.qualifier === 'history' && (
                        <div className="mt-2 text-xs text-indigo-700">提示：過去病史通常改用 Z86/Z87 病史碼，而非現存疾病碼。</div>
                    )}
                    {qualifierLabel && (
                        <button onClick={() => confirmResult(item.code)} className="mt-3 flex items-center text-xs text-blue-600 hover:text-blue-800 font-medium">
                        <CheckCircle className="w-3 h-3 mr-1" /> 改為確定診斷
                        </button>
                    )}
                    </div>
                );
            };

            const SortIcon = ({ colKey }) => {
                if (sortConfig.key !== colKey) return <ArrowUpDown className="w-3 h-3 ml-1 text-slate-300" />;
                return sortConfig.direction === 'asc' 
                ? <ArrowUp className="w-3 h-3 ml-1 text-blue-600" /> 
                : <ArrowDown className="w-3 h-3 ml-1 text-blue-600" />;
            };

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 relative">
                {/* Hidden File Input for Import */}
                <input 
                    type="file" 
                    ref={fileInputRef} 
                    onChange={handleFileChange} 
                    style={{ display: 'none' }} 
                    accept=".json"
                />

                {/* Global Modals & Toasts */}
                <ConfirmModal 
                    isOpen={!!modalConfig} 
                    {...modalConfig} 
                />

                {/* 同步面板 */}
                {syncInfo && (
                    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[90] backdrop-blur-sm p-4" onClick={() => setSyncInfo(null)}>
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
                        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100">
                        <h3 className="text-lg font-bold text-slate-800 flex items-center">
                            <Smartphone className="w-5 h-5 mr-2 text-amber-600" /> 裝置同步
                        </h3>
                        <button onClick={() => setSyncInfo(null)} className="text-slate-400 hover:text-slate-600">
                            <X className="w-5 h-5" />
                        </button>
                        </div>

                        <div className="p-5 space-y-5">
                        <section>
                            <h4 className="text-sm font-bold text-slate-700 mb-2">傳送：這台裝置的 {syncInfo.count} 筆自訂規則</h4>
                            {syncInfo.count === 0 ? (

                        <div className="p-4 border-b border-slate-100 flex flex-col gap-3 bg-slate-50">
                            <div className="flex justify-between items-center">
                            <h2 className="font-bold text-slate-700">
                                目前規則庫 ({filteredDatabase.length === database.length ? database.length : `${filteredDatabase.length} / ${database.length}`})
                                {DATA_VERSION && <span className="ml-2 text-[11px] font-normal text-slate-400">資料版本 {DATA_VERSION}</span>}
                            </h2>
                            
                            {/* Action Buttons */}
                            <div className="flex flex-wrap items-center gap-2">
                                <button onClick={openSyncPanel} className="text-xs flex items-center text-amber-700 hover:bg-amber-50 px-2 py-1 rounded border border-amber-300 transition-colors" title="用連結或 QR 在裝置間同步自訂規則">
                                <Smartphone className="w-3 h-3 mr-1" /> 同步
                                </button>
                                <button onClick={handleExportDb} className="text-xs flex items-center text-blue-600 hover:bg-blue-50 px-2 py-1 rounded border border-blue-200 transition-colors" title="備份資料庫 (.json)">
                                <Download className="w-3 h-3 mr-1" /> 備份
                                </button>
                                <button onClick={handleImportClick} className="text-xs flex items-center text-emerald-600 hover:bg-emerald-50 px-2 py-1 rounded border border-emerald-200 transition-colors" title="還原資料庫 (.json)">
                                <Upload className="w-3 h-3 mr-1" /> 匯入
                                </button>
                                <button onClick={handleCopyForDeveloper} className="text-xs flex items-center text-purple-600 hover:bg-purple-50 px-2 py-1 rounded border border-purple-200 transition-colors" title="複製完整資料庫 (給開發者)">
                                <Code className="w-3 h-3 mr-1" /> 給開發者
                                </button>
                                <div className="h-4 w-px bg-slate-300 mx-1"></div>
                                <button onClick={handleSmartResetDb} className="text-xs text-red-500 hover:text-red-700 underline flex items-center" title="重置為系統預設值 (保留自訂規則)">
                                <RotateCcw className="w-3 h-3 mr-1" /> 重置預設值
                                </button>
                            </div>
                            </div>
                            
                            {/* Search & Filter Bar */}
                            <div className="flex flex-col sm:flex-row gap-2">
                            <div className="relative flex-1">
                                <Search className="w-4 h-4 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" />
                                <input
                                type="text"
                                value={dbQuery}
                                onChange={(e) => setDbQuery(e.target.value)}
                                placeholder="搜尋代碼、名稱、關鍵字或備註…"
                                className="w-full pl-8 pr-8 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white"
                                />
                                {dbQuery && (
                                <button onClick={() => setDbQuery('')} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" title="清除搜尋">
                                    <X className="w-4 h-4" />
                                </button>
                                )}
                            </div>
                            <select
                                value={dbOrgan}
                                onChange={(e) => setDbOrgan(e.target.value)}
                                className="text-sm border border-slate-300 rounded-lg px-2 py-1.5 bg-white focus:ring-2 focus:ring-blue-500 outline-none"
                            >
                                <option value="all">全部系統</option>
                                {ORGAN_CATEGORIES.map(cat => (
                                <option key={cat.value} value={cat.value}>{cat.label}</option>
                                ))}
                            </select>
                            </div>

                            {/* Sort Control Bar */}
                            <div className="flex items-center gap-2 text-xs">
                            <span className="text-slate-500 font-bold">排序方式 (Sort by):</span>
                            <div className="flex bg-white rounded border border-slate-200 p-0.5">
                                <button 
                                onClick={() => requestSort('code')}
                                className={`px-3 py-1 rounded flex items-center transition-colors ${
                                    sortConfig.key === 'code' ? 'bg-blue-100 text-blue-700 font-bold' : 'text-slate-600 hover:bg-slate-50'
                                }`}
                                >
                                Code <SortIcon colKey="code" />
                                </button>
                                <button 
                                onClick={() => requestSort('organ')}
                                className={`px-3 py-1 rounded flex items-center transition-colors ${
                                    sortConfig.key === 'organ' ? 'bg-blue-100 text-blue-700 font-bold' : 'text-slate-600 hover:bg-slate-50'
                                }`}
                                >
                                Organ <SortIcon colKey="organ" />
                                </button>
                                <button 
                                onClick={() => requestSort('standard')}
                                className={`px-3 py-1 rounded flex items-center transition-colors ${
                                    sortConfig.key === 'standard' ? 'bg-blue-100 text-blue-700 font-bold' : 'text-slate-600 hover:bg-slate-50'
                                }`}
                                >
                                Term <SortIcon colKey="standard" />
                                </button>
                            </div>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-0">
                            <table className="w-full text-sm text-left">
                            <thead className="text-xs text-slate-500 uppercase bg-slate-50 sticky top-0 shadow-sm z-10">
                                <tr>
                                <th className="px-4 py-3 cursor-pointer hover:bg-slate-100 transition-colors" onClick={() => requestSort('code')}>
                                    <div className="flex items-center">Code / Organ <SortIcon colKey="code" /></div>
                                </th>
                                <th className="px-4 py-3 cursor-pointer hover:bg-slate-100 transition-colors" onClick={() => requestSort('standard')}>
                                    <div className="flex items-center">Term & Keywords <SortIcon colKey="standard" /></div>
                                </th>
                                <th className="px-4 py-3 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {filteredDatabase.length === 0 && (
                                <tr>
                                    <td colSpan="3" className="px-4 py-10 text-center text-slate-400">找不到符合的規則</td>
                                </tr>
                                )}
                                {filteredDatabase.map((item) => (
                                <tr key={item.id} className={`hover:bg-slate-50 ${editingId === item.id ? 'bg-amber-50' : ''}`}>
                                    <td className="px-4 py-3 font-mono align-top w-32">
                                    <div className="font-bold text-blue-700">{item.code}</div>
                                    {/* 顯示 Organ 標籤 */}
                                    <div className={`mt-1 text-[10px] w-fit px-1.5 py-0.5 rounded ${getOrganColor(item.organ)}`}>
                                        {getOrganLabel(item.organ || 'Other')}
                                    </div>
                                    {item.type === 'broad' && <div className="mt-1 text-[10px] bg-amber-100 text-amber-800 px-1 rounded w-fit">Broad</div>}
                                    {item.type === 'context' && <div className="mt-1 text-[10px] bg-purple-100 text-purple-800 px-1 rounded w-fit">Context</div>}
                                    </td>
                                    <td className="px-4 py-3 align-top">
                                    <div className="font-medium text-slate-800">{item.standard}</div>
                                    <div className="mt-1 flex flex-wrap gap-1">
                                        {item.keywords.map((k, i) => (
                                        <span key={i} className="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded border border-slate-200">
                                            {k}
                                        </span>
                                        ))}
                                    </div>
                                    {item.note && <div className="text-[10px] text-amber-600 mt-1 italic">{item.note}</div>}
                                    </td>
                                    <td className="px-4 py-3 text-right align-top whitespace-nowrap">
                                    <button 
                                        onClick={() => handleEditRule(item)}
                                        className={`p-1 rounded transition-colors mr-2 ${
                                        editingId === item.id 
                                            ? 'text-amber-600 bg-amber-100' 
                                            : 'text-slate-400 hover:text-blue-600 hover:bg-blue-50'
                                        }`}
                                        title="編輯"
                                    >
                                        <Edit2 className="w-4 h-4" />
                                    </button>
                                    <button 
                                        onClick={() => handleDeleteRule(item.id)}
                                        className="text-slate-400 hover:text-red-500 p-1 rounded hover:bg-red-50 transition-colors"
                                        title="刪除"
                                    >
                                        <Trash2 className="w-4 h-4" />
                                    </button>
                                    </td>
                                </tr>
                                ))}
                            </tbody>
                            </table>
                        </div>
                        </div>
                    </div>
                    )}

                </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
